<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232563eb'/%3E%3Cpath d='M4 14l4-4 3 3 5-6 4 4' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mickeymouse House" />
    <meta name="application-name" content="Mickeymouse House" />
    <title>Mickeymouse House</title>
    <style>
      #pt-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: #f8fafc; color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #pt-splash .pt-mark { width: 44px; height: 44px; }
      #pt-splash .pt-name { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
      #pt-splash .pt-spin {
        width: 22px; height: 22px; border: 3px solid #cbd5e1;
        border-top-color: #2563eb; border-radius: 50%;
        animation: pt-spin 0.7s linear infinite;
      }
      @keyframes pt-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="pt-splash">
        <svg class="pt-mark" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <rect width="24" height="24" rx="6" fill="#2563eb" />
          <path d="M4 14l4-4 3 3 5-6 4 4" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <div class="pt-name">Mickeymouse House</div>
        <div class="pt-spin" aria-hidden="true"></div>
        <noscript>
          <p style="max-width: 20rem; text-align: center; color: #991b1b;">
            JavaScript is turned off. Enable it in Settings &gt; Safari &gt; Advanced &gt; JavaScript.
          </p>
        </noscript>
      </div>
    </div>
    <script>
      // Owner request 2026-08-16: warn when a page doesn't finish loading or
      // the browser can't run the app, with concrete ways out. Everything in
      // this block is deliberately ES5 — it must run on exactly the browsers
      // the app itself cannot.
      (function () {
        function showBanner(title, tips) {
          var root = document.getElementById('root');
          if (!root) return;
          var html =
            '<div style="font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',Roboto,sans-serif;max-width:26rem;margin:15vh auto 0;padding:0 24px;color:#0f172a;">' +
            '<h1 style="font-size:18px;color:#991b1b;margin:0 0 10px;">' + title + '</h1>';
          for (var i = 0; i < tips.length; i++) {
            html += '<p style="font-size:14px;line-height:1.5;margin:0 0 8px;color:#334155;">' + tips[i] + '</p>';
          }
          html +=
            '<button onclick="location.reload()" style="margin-top:14px;padding:10px 18px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:14px;font-weight:600;">Try again</button>' +
            '</div>';
          root.innerHTML = html;
        }

        // 1) Feature floor. Modern browsers load the es2020 bundle; older
        // ones (iOS/Safari 11+) load the transpiled legacy bundle that
        // @vitejs/plugin-legacy emits (added 2026-08-16 for old studio
        // iPads). Only an engine below even ES2015 — no arrow functions, no
        // Promise — can run neither, and for it the splash would spin
        // forever, so say so up front.
        var supported = true;
        try { eval('var __f = (a) => a; var __p = Promise.resolve();'); } catch (e) { supported = false; }
        if (!supported) {
          showBanner('This browser is too old for Mickeymouse House', [
            'The app needs iOS 11 / a 2017-or-newer browser at minimum.',
            'iPhone / iPad: update in Settings &gt; General &gt; Software Update. If no update is offered, try installing the Chrome app from the App Store — it can load pages more reliably on older devices.',
            'Computer or Android: update your browser, or install Chrome.',
            'See "System requirements" under Help for the full list.',
          ]);
          return;
        }

        // 2) Load watchdog: the bundle should have booted well inside 12s even
        // on slow studio wifi. If it hasn't (partial download, stale
        // home-screen cache, flaky network), stop the silent spinner and give
        // the ways out. main.jsx sets __ptMounted the moment React takes over.
        window.setTimeout(function () {
          if (window.__ptMounted) return;
          showBanner('The app is taking too long to load', [
            'Tap "Try again" first — this is usually a network hiccup.',
            'Opening from a home-screen icon? Delete the icon, load the site fresh in the browser, and add it to your home screen again.',
            'If it keeps happening on iPhone / iPad: update your device in Settings &gt; General &gt; Software Update, or try the Chrome app from the App Store.',
          ]);
        }, 12000);

        window.addEventListener('error', function (event) {
          if (window.__ptMounted) return;
          showBanner('Mickeymouse House failed to load', [
            (event && event.message) ? String(event.message) : 'Something stopped the app from starting.',
            'Tap "Try again". If it keeps happening, update your device\'s software — or on iPhone / iPad, try the Chrome app from the App Store.',
          ]);
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
